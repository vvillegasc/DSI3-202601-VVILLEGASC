<!doctype html>
<html>
  <head>
    <title>Formulario</title>
    <link rel="stylesheet" href="validaciones.css" />
  </head>

  <body>
    <div class="formulario">
      <h2 class="formulario__title">Formulario de validaciones</h2>

      <input
        class="formulario__input"
        type="text"
        id="nombre"
        placeholder="Nombre" />

      <input
        class="formulario__input"
        type="number"
        id="edad"
        placeholder="Edad" />

      <input
        class="formulario__input"
        type="number"
        id="nota"
        placeholder="Nota (0 - 5)"
        step="0.1"
        min="0"
        max="5" />

      <button class="formulario__button" onclick="validar()">Enviar</button>
    </div>

    <script src="validaciones.js"></script>
  </body>
</html>
