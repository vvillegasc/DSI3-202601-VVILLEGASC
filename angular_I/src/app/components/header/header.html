<h4 class="hdr-title">{{ title }}</h4>
<p class="hdr-description">{{ description }}</p>

<div class="hdr-input-row">
  <label class="hdr-label">{{ label }}</label>
  <input class="hdr-input" type="number" [(ngModel)]="this.count" />
  <button class="hdr-btn" (click)="calculate()">{{ actionName }}</button>
</div>
