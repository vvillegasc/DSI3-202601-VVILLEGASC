<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadora.css" />
  </head>
  <body>
    <h1>Calculadora de notas</h1>
    <div>
      <div class="nota1">
        <label for="">Nota 1 (5%)</label>
        <input type="number" id="nota1" min="1" max="5" step="0.1" />
      </div>
      <div class="nota2">
        <label for="">Nota 2 (10%)</label>
        <input type="number" id="nota2" min="1" max="5" step="0.1" />
      </div>
      <div class="nota3">
        <label for="">Nota 3 (10%)</label>
        <input type="number" id="nota3" min="1" max="5" step="0.1" />
      </div>
      <div class="nota4">
        <label for="">Nota 4 (10%)</label>
        <input type="number" id="nota4" min="1" max="5" step="0.1" />
      </div>
      <div class="nota5">
        <label for="">Nota 5 (15%)</label>
        <input type="number" id="nota5" min="1" max="5" step="0.1" />
      </div>
      <div class="nota6">
        <label for="">Nota 6 (15%)</label>
        <input type="number" id="nota6" min="1" max="5" step="0.1" />
      </div>
      <div class="nota7">
        <label for="">Nota 7 (15%)</label>
        <input type="number" id="nota7" min="1" max="5" step="0.1" />
      </div>
      <div class="nota8">
        <label for="">Nota 8 (20%)</label>
        <input type="number" id="nota8" min="1" max="5" step="0.1" />
      </div>

      <button id="btnCalcular">Calcular</button>

      <div id="resultado"></div>
    </div>

    <script src="calculadora.js"></script>
  </body>
</html>
