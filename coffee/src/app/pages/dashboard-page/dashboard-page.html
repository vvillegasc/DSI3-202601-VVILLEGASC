@if (user) {
  <div class="dashboard">
    <table class="dashboard__table">
      <tbody>
        <tr>
          <th>Cédula</th>
          <td>{{ user.cedula }}</td>
        </tr>
        <tr>
          <th>Nombre completo</th>
          <td>{{ user.nombre }}</td>
        </tr>
        <tr>
          <th>Correo electrónico</th>
          <td>{{ user.email }}</td>
        </tr>
        <tr>
          <th>Carrera</th>
          <td>{{ carreraLabel }}</td>
        </tr>
      </tbody>
    </table>
  </div>
}
