@if (user) {
  <div class="dashboard">
    <table class="dashboard__table">
      <tbody>
        <tr>
          <th>Cédula</th>
          <td>{{ user.cedula }}</td>
        </tr>
        <tr>
          <th>Nombre</th>
          <td>{{ user.nombre }}</td>
        </tr>
        <tr>
          <th>Apellidos</th>
          <td>{{ user.apellidos }}</td>
        </tr>
        <tr>
          <th>Correo electrónico</th>
          <td>{{ user.email }}</td>
        </tr>
        <tr>
          <th>Ciudad de residencia</th>
          <td>{{ user.ciudad }}</td>
        </tr>
      </tbody>
    </table>
  </div>
}
