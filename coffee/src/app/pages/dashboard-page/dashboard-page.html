@if (user) {
  <div class="dashboard">
    <div class="dashboard__card">

      <div class="dashboard__avatar">
        <span class="dashboard__initials">{{ initials }}</span>
      </div>

      <h2 class="dashboard__name">{{ user.nombre }}</h2>
      <p class="dashboard__email">{{ user.email }}</p>

      <hr class="dashboard__divider" />

      <ul class="dashboard__info">
        <li class="dashboard__info-item">
          <span class="dashboard__info-label">Cédula</span>
          <span class="dashboard__info-value">{{ user.cedula }}</span>
        </li>
        <li class="dashboard__info-item">
          <span class="dashboard__info-label">Nombre completo</span>
          <span class="dashboard__info-value">{{ user.nombre }}</span>
        </li>
        <li class="dashboard__info-item">
          <span class="dashboard__info-label">Correo electrónico</span>
          <span class="dashboard__info-value">{{ user.email }}</span>
        </li>
        <li class="dashboard__info-item">
          <span class="dashboard__info-label">Carrera</span>
          <span class="dashboard__info-value">{{ carreraLabel }}</span>
        </li>
      </ul>

      <button class="dashboard__logout" (click)="logout()">Cerrar sesión</button>

    </div>
  </div>
}
